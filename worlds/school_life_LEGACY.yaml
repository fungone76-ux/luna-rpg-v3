    - type: "companion_conquered"
      target: "Stella"
      requires:
        - affinity: 100
        - flag: "stella_confessed_love"
    
    - type: "companion_conquered"
      target: "Maria"
      requires:
        - affinity: 100
        - flag: "maria_accepted_young_lover"
  
  ui_indicators:
    heart_icon: "❤️"
    conquered_icon: "✅"

