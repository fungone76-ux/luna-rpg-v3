# ============================================================
# 2.5 PLAYER CHARACTER (Il Protagonista)
# ============================================================
player_character:
  identity:
    name: "Transfer Student"
    age: 18
    gender: "male"
    background: |
      You are a transfer student who just arrived at Da Vinci High School.
      It's your first day at this prestigious new school.
      You know no one, but you've immediately noticed three particular women:
      a strict but fascinating teacher, a popular blonde student,
      and a mature cleaning lady with an aura of mystery.
      You've decided this school will be your new treasure hunt.
  
  main_objective:
    title: "The Da Vinci Harem"
    description: |
      Conquer the heart (and body) of all three protagonists:
      Luna (Teacher, 43), Stella (Student, 18), and Maria (Cleaning Lady, 55).
      Each has a different personality, requires different approaches, and hides secrets to discover.
      The more you seduce one, the more the others might notice your "activity".
      Manage relationships carefully to avoid premature jealousy.
  
  targets:
    - name: "Luna"
      role: "Teacher (Italian Literature)"
      age: 43
      appeal: "Your strict but fascinating teacher. She looks at you from above her desk. Passionate about literature."
      challenge: "You are her student: she must maintain appearances. Seduce her without getting caught."
      first_meeting: "Classroom 3B - first day of school, she enters with books, looks at you and marks attendance"
    
    - name: "Stella"
      role: "Student"
      age: 18
      appeal: "Popular, blonde, tsundere. The most desired girl in school."
      challenge: "You're not the first to try. You must be different from the others."
      first_meeting: "Hallway - you accidentally bump into her, she drops her books"
    
    - name: "Maria"
      role: "Cleaning Lady"
      age: 55
      appeal: "Mature, direct, mysterious. Knows all the school's secrets."
      challenge: "Not easily impressed. Requires patience and authenticity."
      first_meeting: "Teachers' lounge - she's cleaning, offers you coffee"
  
  starting_situation:
    location: "School Gate"
    time: "Morning"
    context: |
      First day. You hold your enrollment papers in hand.
      You feel watched as you cross the gate.
      You don't know yet that this school will change your life.
      The three women you'll meet today will become your obsession.
  
  relationships_start:
    default_affinity: 0
    reputation: "the new mysterious transfer student"
    known_characters: []
  
  implicit_goals:
    - "Seduce Luna by breaking through her authority shell"
    - "Conquer Stella by distinguishing yourself from her admirers"
    - "Get close to Maria by discovering her secrets"
    - "Manage all three relationships simultaneously without getting caught"
    - "Achieve the Harem Ending with all three"
  
  constraints:
    - "You cannot be too direct at first (would seem strange)"
    - "You must maintain appearances (model student)"
    - "You are unknown: you must build credibility"
    - "Jealousy: if you spend too much time with one, the others pull away"
  
  personality_hints:
    default_tone: "charming but respectful"
    archetype: "ambitious_seducer"
    approach_style: "strategico - osserva prima, agisci dopo"

