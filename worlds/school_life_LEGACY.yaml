  name: "High School Harem - Complete Edition"
  genre: "Dating Sim, School Life, Romance, Erotic (18+)"
  version: "3.0.0"
  author: "Luna RPG Team"
  
  world_lore: |
    Setting: "Da Vinci" High School. Spring Term.
    A prestigious institute where desire hides behind respectable facades.
    The school has a secret history of forbidden encounters between staff and students.
    A place where power dynamics and attraction create dangerous temptations.
    
  timeline:
    start_day: 1
    time_cycle: ["Morning", "Afternoon", "Evening", "Night"]
    days_of_week: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]

