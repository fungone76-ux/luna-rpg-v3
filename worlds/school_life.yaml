global_events:
  rainstorm:
    meta:
      title: "Sudden Rain"
      description: "A storm traps you with the current companion"
    
    trigger:
      type: "random"
      chance: 0.15
      conditions:
        - location_type: "outdoor"
        - time: "Afternoon"
    
    effect:
      description: "All companions seek shelter"
      actions:
        - action: "set_emotional_state"
          character: "{current_companion}"
          state: "flustered"
    
    on_expire:
      - action: "set_emotional_state"
        character: "{current_companion}"
        state: "default"
  
  power_outage:
    meta:
      title: "Blackout"
      description: "School lights go out"
    
    trigger:
