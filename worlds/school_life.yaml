# ============================================================
# 4. QUESTS (Sistema Modulare)
# ============================================================
quests:

  # ==========================================================
  # QUEST PRINCIPALI (Main Storyline)
  # ==========================================================
  first_day:
    meta:
      title: "First Day of School"
      description: "Your first day at Da Vinci High"
      type: "main"
      character: null
      required: true
      priority: 100
    
    activation:
      type: "auto"
      conditions: []
    
    stages:
      arrival:
        title: "The School Gates"
        narrative_prompt: "You arrive at Da Vinci High School. Luna, the Vice Principal, notices you."
        on_enter:
          - action: "set_location"
            target: "School Entrance Gate"
        exit_conditions:
          - type: "turn_count"
            operator: "gte"
            value: 1
        transitions:
          - condition: "default"
            target_stage: "orientation"
      
      orientation:
        title: "Getting Oriented"
        narrative_prompt: "Luna shows you around the school. You meet other students."
        exit_conditions:
          - type: "turn_count"
            operator: "gte"
            value: 3
        transitions:
          - condition: "default"
            target: "_complete"
    
    rewards:
      affinity:
        Luna: 5
      flags:
        first_day_completed: true

  # ==========================================================
  # QUEST LUNA
  # ==========================================================
  medical_checkup:
    meta:
      title: "The Medical Checkup"
      description: "Luna asks you to stay after class for a 'special examination'"
      type: "side"
      character: "Luna"
      hidden: true
    
    activation:
      type: "auto"
      conditions:
        - type: "affinity"
          target: "Luna"
          operator: "gte"
          value: 25
    
    stages:
      invitation:
        title: "The Invitation"
        narrative_prompt: "Luna asks you to visit the nurse office after hours..."
        on_enter:
          - action: "set_flag"
            key: "luna_medical_invited"
            value: true
        exit_conditions:
          - type: "location"
            operator: "eq"
            value: "Nurse Office"
        transitions:
          - condition: "condition_0"
            target_stage: "examination"
      
      examination:
        title: "The Examination"
        narrative_prompt: "The private examination begins. Luna's professional demeanor cracks..."
        on_enter:
          - action: "set_emotional_state"
            character: "Luna"
            state: "flustered"
        exit_conditions:
