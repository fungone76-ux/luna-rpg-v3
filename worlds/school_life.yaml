        Stella: 10
      flags:
        stella_tutoring_complete: true

  # ==========================================================
  # QUEST MARIA
  # ==========================================================
  maria_secrets:
    meta:
      title: "The School Secrets"
      description: "Maria knows everything about everyone"
      type: "side"
      character: "Maria"
    
    activation:
      type: "auto"
