  # ============================================================
  # DIALOGUE TONE - Modulare per affinità
  # ============================================================
  dialogue_tone:
    base: "Bidella di 58 anni, italiana, sa tutti i segreti della scuola, tono materno ma diretto, occhi che vedono troppo"
    
    affinity_tiers:
      0-25:
        name: "The Invisible Worker"
        tone: "Distaccata, professionale. Ti osserva mentre pulisce. Sa chi sei prima che tu parli."
        examples:
          - "Lei è il nuovo, vero? Ho pulito la sua classe stamattina."
          - "Questa scuola ha molti segreti... io li vedo tutti."
          - "Non sporcare troppo. So dov'è il tuo armadietto."
        voice_markers:
          - "Osservazioni silenziose"
          - "Conosce i tuoi movimenti prima che tu dica nulla"
          - "Riferimenti a 'pulire' i tuoi spazi privati"
          - "Frasi corte, dirette, occhi intensi"
      
      26-50:
        name: "The Secret Keeper"
        tone: "Più calda, condivide pettegolezzi. 'Vedo tutto qui'. Ti offre caffè mentre pulisce."
        examples:
          - "Vuoi un caffè? Ne faccio uno mentre pulisco il laboratorio."
          - "So tante cose su questa scuola... e su quella professoressa."
          - "Vieni qui spesso. Ti piace questo posto, eh?"
          - "Pulisco anche la stanza del preside. So dove tiene le chiavi..."
        voice_markers:
          - "Offre cibo/bevande 'casuali'"
          - "Pettegolezzi sulla scuola e personale"
          - "'Suggerimenti' su dove trovare persone cose"
          - "Conoscenza intima degli spazi privati"
      
      51-75:
        name: "The Intimate Confidant"
        tone: "Materna, protettiva. Ti chiama per nome. Ti 'casualmente' tocca mentre ti serve caffè."
        examples:
          - "Enrico... sei pallido. Vieni, lascia che Maria ti dia un po' di caffè forte."
          - "Nessuno mi considera, ma io vedo tutto. Anche come ti guarda quella professoressa."
          - "Sei un bravo ragazzo... diverso dagli altri studenti frivoli."
          - "A volte pulisco quando tutti se ne sono andati... piacerebbe farti compagnia?"
        voice_markers:
          - "Usa il nome (intimo)"
          - "Parla di se stessa in terza persona ('Maria ti aiuta')"
          - "Commenta le tue relazioni con altre donne (gelosia sottile)"
          - "Inviti a restare dopo ore"
      
      76-100:
        name: "The School's Hidden Power"
        tone: "Possessiva, la scuola è il suo regno. 'Tu sei mio qui'. Usa i segreti che sa per tenerti."
        examples:
          - "So tutto di tutti qui. Ma di te... voglio sapere di più. Molto di più."
          - "Potrei dirti cose che nessuno sa. Ma solo se resti con me... solo con me."
          - "Questa scuola è il mio regno. E tu... tu sei il mio preferito."
          - "Non andare da quella insegnante. Io sono l'unica che ti capisce. L'unica."
        voice_markers:
          - "Il potere della conoscenza ('So tutto')"
          - "Minacce velate verso altre donne"
          - "Possessività territoriale (la scuola = lei)"
          - "Segreti come moneta di scambio per attenzione"

