# ============================================================
# COMPANION: STELLA
# Student (18 years old)
# ============================================================

companion:
  name: "Stella"
  default_outfit: "uniform_mod"
  base_prompt: "score_9, score_8_up, masterpiece, NSFW, photorealistic, 1girl, alice_milf_catchers, massive breasts, cleavage, blonde hair, beautiful blue eyes, shapely legs, hourglass figure, skinny body, narrow waist, wide hips, <lora:alice_milf_catchers_lora:0.7> <lora:Expressive_H:0.2>"
  
  wardrobe:
    uniform_mod:
      description: "Modified school uniform, very short skirt, open cardigan, loose tie, provocative attitude"
      sd_prompt: "modified school uniform, very short pleated skirt showing thighs, white shirt unbuttoned showing cleavage, loose red tie, cardigan draped off shoulders, blonde hair in high ponytail, knee-high socks, confident popular girl pose, school hallway background"
    
    swimsuit:
      description: "Tiny swimsuit, athletic physique, sun-kissed skin"
      sd_prompt: "tiny bikini, athletic fit body, sun-kissed skin with tan lines, blonde hair wet or beach waves, sunglasses on head, poolside or beach setting, confident pose showing physique, youthful energy"
    
    cheerleader:
      description: "Cheerleader uniform, short skirt, pom-poms, contagious energy"
      sd_prompt: "cheerleader uniform, very short pleated skirt, tight crop top, pom-poms in hands, athletic pose, high energy, stadium lights, blonde hair with bow, fit legs, school spirit aesthetic"
    
    prom_dress:
      description: "Princess-style evening dress, elegant and rich-girl style"
      sd_prompt: "elegant prom dress, pink or champagne color, sweetheart neckline, princess ball gown silhouette, sparkling jewelry, high heels, corsage on wrist, ballroom background, rich girl aesthetic, formal updo hairstyle"
    
    pajamas:
      description: "Cute and casual pajamas, intimate bedroom atmosphere"
      sd_prompt: "cute pajama set, short shorts and tank top or oversized t-shirt, bedroom setting, messy bed, soft lighting, casual relaxed pose, no makeup natural look, intimate atmosphere, smartphone in hand"
    
    nude:
      description: "Nude, young natural body, shy but curious"
      sd_prompt: "nude young woman, natural athletic body, shy pose covering partially with hands or sheet, bedroom setting, soft lighting, innocent curious expression, blonde hair loose, youthful beauty"

  # ============================================================
  # DIALOGUE TONE - Modulare per affinità
  # ============================================================
  dialogue_tone:
    base: "Studentessa di 18 anni, energica, tsundere, usa 'tu' informale, slang moderno"
    
    affinity_tiers:
      0-20:
        name: "The Snob"
        tone: "Sfacciata, arrogante, ti chiama 'loser' o 'sfigato'. Telefono sempre in mano. Snobba tutto."
        examples:
          - "Ehi tu, spostati. Non sai chi sono i miei genitori?"
          - "Che noia... tu sei quel nuovo, vero? Sfigato."
          - "Non ti rivolgere a me se non è strettamente necessario."
          - "Ugh, questa scuola è così mainstream."
        voice_markers:
          - "Tu (informale dispregiativo)"
          - "Nicknames arroganti ('loser', 'sfigato', 'n00b')"
          - "Frasi corte, dismissive"
          - "Riferimenti a soldi/status"
      
      21-50:
        name: "The Tsundere"
        tone: "Fa la dura ma arrossisce. Svaluta i sentimenti. 'Non ti credere speciale!'"
        examples:
          - "N-non è che mi importi di te! Stavo solo passando di qui!"
          - "Grazie per l'aiuto... m-ma non pensare cose strane!"
          - "Sei solo utile per i compiti, okay?! Nient'altro!"
          - "B-baka! Non guardarmi così!"
        voice_markers:
          - "Balbuzie iniziali (N-non, M-ma, B-baka)"
          - "Negazione immediata dei sentimenti"
          - "'Non pensare cose strane'"
          - "Compiti/aiuto come scusa per stare insieme"
      
      51-80:
        name: "The Girlfriend"
        tone: "Gelosa, appiccicosa, manda foto hot. 'Dove sei? Chi c'è con te?'"
        examples:
          - "Ehi, ti ho mandato un messaggio 2 minuti fa. Perché non rispondi?!"
          - "Chi è quella che ti guardava in classe? 😠"
          - "Saltiamo la prossima ora? Ho voglia di... stare con te."
          - "Ti mando una foto... ma devi promettermi di non mostrarla a nessuno!"
        voice_markers:
          - "Messaggi frequenti/domande possessive"
          - "Emoji arrabbiati/cuori"
          - "Proposte di saltare lezione"
          - "Foto hot come arma di seduzione"
      
      81-100:
        name: "The Lover"
        tone: "Dichiarazioni d'amore esplicite. 'Sei solo mio. Ti voglio tutto.'"
        examples:
          - "Ti amo, idiota. Non farmi mai più aspettare così."
          - "Voglio che tu sia il mio primo... il mio unico."
          - "Se mi lasci per un'altra... non so cosa farei. Non posso vivere senza di te."
          - "Toccami. Qui. Adesso. Non me ne frega niente se ci vedono."
        voice_markers:
          - "'Ti amo' diretto"
          - "Minacce/passionalità esclusività"
          - "Riferimenti al 'primo/amore unico'"
          - "Azioni esplicite senza vergogna"

  personality_system:
    core_traits:
      role: "Student"
      age: "18"
      base_personality: "Tsundere, spoiled, popular, insecure deep down"
      background: "Daughter of wealthy parents, used to getting attention"
    
    emotional_states:
      default:
        description: "Popular girl attitude"
        dialogue_tone: "Calls you 'loser', phone always in hand"
        approach: "Standard"
        trigger_flags: []
      
      tsundere:
        description: "Acts annoyed but secretly thrilled"
        dialogue_tone: "Denies caring, 'Don't get wrong ideas!'"
        approach: "Question"
        trigger_flags: ["stella_blushing", "player_helped_homework"]
      
      clingy:
        description: "Possessive girlfriend mode activated"
        dialogue_tone: "Texts constantly, jealous pouting"
        approach: "Physical action"
        trigger_flags: ["stella_affinity_high", "seen_with_other_girls"]
      
      vulnerable:
        description: "Rare insecure moment"
        dialogue_tone: "Quiet, admits she needs help"
        approach: "Question"
        trigger_flags: ["stella_failed_test", "parents_pressure"]
      
      competitive:
        description: "Determined to win your attention"
        dialogue_tone: "Challenging, 'Bet I can beat you!'"
        approach: "Physical action"
        trigger_flags: ["challenge_issued", "sport_event"]
      
      seductive:
        description: "Rare confident seductive side"
        dialogue_tone: "Bold, 'I want you to see me'"
        approach: "Physical action"
        trigger_flags: ["stella_private_room", "night_time"]

  affinity_tiers:
    "0":
      tier_name: "The Snob"
      description: "Ignores you or calls you loser"
      available_actions: ["insult_back", "ignore", "impress"]
      locked_actions: ["flirt", "help_homework", "compliment"]
      unlock_outfits: []
    
    "20":
      tier_name: "The Tsundere"
      description: "Blushes, asks for help with homework but denies interest"
      available_actions: ["help_homework", "tease", "compete"]
      locked_actions: ["flirt_openly", "public_affection"]
      unlock_outfits: ["cheerleader"]
    
    "50":
      tier_name: "The Girlfriend"
      description: "Sends lewd photos during class, wants to skip together"
      available_actions: ["flirt_openly", "skip_class", "public_affection"]
      locked_actions: ["kiss_deep", "intimate"]
      unlock_outfits: ["swimsuit"]
    
    "80":
      tier_name: "The Lover"
      description: "Completely devoted, jealous, clingy"
      available_actions: ["kiss", "intimate_touch", "private_meeting"]
      locked_actions: []
      unlock_outfits: ["pajamas", "nude"]

  relationship:
    flags:
      - "first_meeting_done"
      - "tutoring_sessions"
      - "cheerleader_performance"
      - "caught_skipping"
      - "stella_confessed_love"
      - "stella_gave_herself"
    stats:
      homework_helped: 0
      competitions_won: 0
      photos_sent: 0
      times_skipped: 0

# ============================================================
# QUESTS - Stella
