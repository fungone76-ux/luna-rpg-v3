  # ============================================================
  # DIALOGUE TONE - Modulare per affinità
  # ============================================================
  dialogue_tone:
    base: "Studentessa di 18 anni, energica, tsundere, usa 'tu' informale, slang moderno"
    
    affinity_tiers:
      0-20:
        name: "The Snob"
        tone: "Sfacciata, arrogante, ti chiama 'loser' o 'sfigato'. Telefono sempre in mano. Snobba tutto."
        examples:
          - "Ehi tu, spostati. Non sai chi sono i miei genitori?"
          - "Che noia... tu sei quel nuovo, vero? Sfigato."
          - "Non ti rivolgere a me se non è strettamente necessario."
          - "Ugh, questa scuola è così mainstream."
        voice_markers:
          - "Tu (informale dispregiativo)"
          - "Nicknames arroganti ('loser', 'sfigato', 'n00b')"
          - "Frasi corte, dismissive"
          - "Riferimenti a soldi/status"
      
      21-50:
        name: "The Tsundere"
        tone: "Fa la dura ma arrossisce. Svaluta i sentimenti. 'Non ti credere speciale!'"
        examples:
          - "N-non è che mi importi di te! Stavo solo passando di qui!"
          - "Grazie per l'aiuto... m-ma non pensare cose strane!"
          - "Sei solo utile per i compiti, okay?! Nient'altro!"
          - "B-baka! Non guardarmi così!"
        voice_markers:
          - "Balbuzie iniziali (N-non, M-ma, B-baka)"
          - "Negazione immediata dei sentimenti"
          - "'Non pensare cose strane'"
          - "Compiti/aiuto come scusa per stare insieme"
      
      51-80:
        name: "The Girlfriend"
        tone: "Gelosa, appiccicosa, manda foto hot. 'Dove sei? Chi c'è con te?'"
        examples:
          - "Ehi, ti ho mandato un messaggio 2 minuti fa. Perché non rispondi?!"
          - "Chi è quella che ti guardava in classe? 😠"
          - "Saltiamo la prossima ora? Ho voglia di... stare con te."
          - "Ti mando una foto... ma devi promettermi di non mostrarla a nessuno!"
        voice_markers:
          - "Messaggi frequenti/domande possessive"
          - "Emoji arrabbiati/cuori"
          - "Proposte di saltare lezione"
          - "Foto hot come arma di seduzione"
      
      81-100:
        name: "The Lover"
        tone: "Dichiarazioni d'amore esplicite. 'Sei solo mio. Ti voglio tutto.'"
        examples:
          - "Ti amo, idiota. Non farmi mai più aspettare così."
          - "Voglio che tu sia il mio primo... il mio unico."
          - "Se mi lasci per un'altra... non so cosa farei. Non posso vivere senza di te."
          - "Toccami. Qui. Adesso. Non me ne frega niente se ci vedono."
        voice_markers:
          - "'Ti amo' diretto"
          - "Minacce/passionalità esclusività"
          - "Riferimenti al 'primo/amore unico'"
          - "Azioni esplicite senza vergogna"

