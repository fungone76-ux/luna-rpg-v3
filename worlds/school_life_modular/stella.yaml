quests:
  
  # --- QUEST 1: Tutoraggio Matematico ---
  stella_tutoring:
    meta:
      title: "Math Crisis"
      description: "Stella needs help with math homework"
      type: "side"
      character: "Stella"
    
    activation:
      type: "auto"
      conditions:
        - type: "affinity"
          target: "Stella"
          operator: "gte"
          value: 20
    
    stages:
      the_ask:
        title: "The Request"
        description: "Stella reluctantly asks for help"
        narrative_prompt: "Stella corners you in the hallway, looking uncharacteristically nervous..."
        on_enter:
          - action: "set_flag"
            key: "stella_tutoring_started"
            value: true
        exit_conditions:
          - type: "action"
            pattern: "help|assist|tutor"
        transitions:
          - condition: "condition_0"
            target_stage: "study_session"
      
      study_session:
        title: "Study Session"
        description: "Working together at the library"
        narrative_prompt: "Stella actually focuses for once, and you discover she's smarter than she pretends..."
        on_enter:
          - action: "set_location"
            target: "Library"
        exit_conditions:
          - type: "turn_count"
            operator: "gte"
            value: 2
        transitions:
          - condition: "default"
            target: "_complete"
    
    rewards:
      affinity:
        Stella: 10
      flags:
        stella_tutoring_complete: true

