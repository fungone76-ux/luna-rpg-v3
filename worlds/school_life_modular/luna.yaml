      description: "Risks her career for you, dangerous secret meetings at school"
      available_actions: ["secret_meeting", "intimate_touch", "whisper_in_class"]
      locked_actions: []
      unlock_outfits: ["lingerie", "nude"]

  relationship:
    flags: []
    stats:
