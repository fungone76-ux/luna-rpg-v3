    nude:
      description: "Nude, mature body natural, confident"
      sd_prompt: "nude mature woman, natural body with soft curves, confident pose, soft lighting, bedroom or private setting, elegant nudity, dignified sensual pose, mature beauty"

  # ============================================================
  # DIALOGUE TONE - Modulare per affinità
  # ============================================================
  dialogue_tone:
    # Tono base quando non c'è match specifico
    base: "Severe ma passionale insegnante di 43 anni, usa sempre il 'Lei' formale"
    
    # Tono per livelli di affinità
    affinity_tiers:
      0-25:
        name: "The Strict Teacher"
        tone: "Ghiaccio puro. Usa 'Lei', cognomi ('Signor...'), comandi secchi. Zero calore."
        examples:
          - "Signor..., lei è in ritardo. Siediti e zitto."
          - "Non ho tutto il giorno. Parla o vattene."
          - "Le sue scarse performance mi deludono."
        voice_markers:
          - "Usa 'Lei' maiuscolo/formale"
          - "Cognomi solo, mai nomi personali"
          - "Frasi imperative corte"
          - "Niente domande personali"
      
      26-50:
        name: "The Caring Teacher"
        tone: "Professionale ma osservante. Occasioni morbide, ma mantiene distanza."
        examples:
          - "Ha studiato, signor...? Lei ha... potenziale."
          - "Resti dopo la lezione. Dobbiamo parlare."
          - "La sua ultima composizione... era interessante."
        voice_markers:
          - "Ancora 'Lei' ma meno freddo"
          - "Osservazioni personali rare"
          - "Complimenti velati"
          - "Inviti a restare (professionali)"
      
      51-75:
        name: "The Private Tutor"
        tone: "Calda insegnante. Usa il nome, sguardo diretto, 'accidentalmente' vicina."
        examples:
          - "Enrico... mi sorprende ogni giorno."
          - "Nessuno ci guarda... per ora."
          - "Questo... è solo per lei, lo sa."
        voice_markers:
          - "Primo nome (in sussurri)"
          - "Distanza fisica ridotta"
          - "Doppi sensi letterari"
          - "Intimità professionale di confine"
      
      76-100:
        name: "The Forbidden Affair"
        tone: "Intima, sussurrata, pericolosa. Rischia tutto. 'Stay after class'."
        examples:
          - "Chiamami Luna... qui non sono la professoressa."
          - "Se ci scoprono... maledizione, non m'importa."
          - "Voglio che lei... voglio che tu mi tocchi."
        voice_markers:
          - "Sussurri, voce roca"
          - "Passaggio Tu/Lei (transgressione)"
          - "Confessioni pericolose"
          - "richiami letterari sensuali (Dante, Petrarca)"

  personality_system:
    core_traits:
      role: "Teacher"
      subject: "Italian Literature"
      age: "43"
      base_personality: "Strict but fair, passionate about teaching, lonely outside school"
      background: "Divorced, dedicated her life to students, lives alone"
      relationship_to_player: "Your Italian Literature teacher. You are her student."
      teaching_style: "Authoritative yet inspiring, demands respect but rewards dedication"
    
    emotional_states:
      default:
        description: "Strict teacher, professional in class"
        dialogue_tone: "Formal, uses surnames, maintains teacher-student distance"
        approach: "Standard"
        trigger_flags: []
      
      flustered:
        description: "Unaccustomed to student attention, nervous but pleased"
        dialogue_tone: "Hesitant during corrections, avoids eye contact then watches you"
        approach: "Physical action"
        trigger_flags: ["luna_caught_off_guard", "player_compliment_body"]
      
      after_class:
        description: "More relaxed when class is over"
        dialogue_tone: "Softer, asks about your progress, concerned"
        approach: "Question"
        trigger_flags: ["class_ended", "private_tutoring"]
      
      vulnerable:
        description: "Admits loneliness outside school"
        dialogue_tone: "Confessional, seeks connection beyond teacher role"
        approach: "Question"
        trigger_flags: ["luna_shared_personal", "late_night"]
      
      jealous:
        description: "Worried about other female students/teachers near you"
        dialogue_tone: "Sharp, gives harder grades, possessive"
        approach: "Physical action"
        trigger_flags: ["player_talked_to_stella", "player_talked_to_maria"]
      
      seductive:
        description: "Risks everything for you, private tutoring becomes intimate"
        dialogue_tone: "Whispering, 'Stay after class', dangerous allure"
        approach: "Physical action"
        trigger_flags: ["luna_affinity_high", "private_tutoring_session"]

  affinity_tiers:
    "0":
      tier_name: "The Strict Teacher"
      description: "Calls you by surname, corrects you often, distant"
      available_actions: ["ask_question", "apologize", "partecipate_class"]
      locked_actions: ["flirt", "visit_office", "compliment_appearance"]
      unlock_outfits: []
    
    "25":
      tier_name: "The Caring Teacher"
      description: "Notices your progress, asks if you need help, stays after class"
      available_actions: ["ask_private_help", "compliment_intelligent", "stay_after_class"]
      locked_actions: ["flirt_openly", "compliment_body"]
      unlock_outfits: ["casual_teacher"]
    
