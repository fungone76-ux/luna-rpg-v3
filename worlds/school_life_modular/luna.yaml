quests:
  
  # --- QUEST 1: Visita Medica ---
  medical_checkup:
    meta:
      title: "The Medical Checkup"
      description: "Luna asks you to stay after class for a 'special examination'"
      type: "side"
      character: "Luna"
      hidden: true
    
    activation:
      type: "auto"
      conditions:
        - type: "affinity"
          target: "Luna"
          operator: "gte"
          value: 25
    
    stages:
      invitation:
        title: "The Invitation"
        narrative_prompt: "Luna asks you to visit the nurse office after hours..."
        on_enter:
          - action: "set_flag"
            key: "luna_medical_invited"
            value: true
        exit_conditions:
          - type: "location"
            operator: "eq"
            value: "Nurse Office"
        transitions:
          - condition: "condition_0"
            target_stage: "examination"
      
      examination:
        title: "The Examination"
        narrative_prompt: "The private examination begins. Luna's professional demeanor cracks..."
        on_enter:
          - action: "set_emotional_state"
            character: "Luna"
            state: "flustered"
        exit_conditions:
          - type: "turn_count"
            operator: "gte"
            value: 3
        transitions:
          - condition: "default"
            target: "_complete"
    
    rewards:
      affinity:
        Luna: 15
      flags:
        medical_quest_done: true
      unlock_quests:
        - "luna_office_secret"

